services:
  openswarm:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./mnt:/app/mnt
      - ./uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 8G
        reservations:
          cpus: '0.5'
          memory: 512M
